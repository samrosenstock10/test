name: Verify AI infrastructure feeds

on:
  pull_request:
    paths:
      - 'buy-window/ai-infrastructure-theses.json'
      - 'buy-window/semi-analysis-theses.json'
      - 'automation/ai-infrastructure-feed.mjs'
      - 'automation/ai-infrastructure-feed.node-test.mjs'
      - 'docs/automation/ai-infrastructure-feed.md'
      - '.github/workflows/verify-ai-infrastructure-feed.yml'
      - '.github/workflows/accept-ai-infrastructure-feed.yml'
  push:
    branches:
      - main
    paths:
      - 'buy-window/ai-infrastructure-theses.json'
      - 'buy-window/semi-analysis-theses.json'
      - 'automation/ai-infrastructure-feed.mjs'
      - 'automation/ai-infrastructure-feed.node-test.mjs'
      - 'docs/automation/ai-infrastructure-feed.md'
      - '.github/workflows/verify-ai-infrastructure-feed.yml'
      - '.github/workflows/accept-ai-infrastructure-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run feed contract tests
        run: node --test automation/ai-infrastructure-feed.node-test.mjs
      - name: Validate current semantic feed pair
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          import { validateFeedPair } from './automation/ai-infrastructure-feed.mjs';

          const combined = JSON.parse(await readFile('buy-window/ai-infrastructure-theses.json', 'utf8'));
          const legacy = JSON.parse(await readFile('buy-window/semi-analysis-theses.json', 'utf8'));
          if (combined.updatedAt !== legacy.updatedAt) throw new Error('legacy_updated_at_mismatch');
          if (JSON.stringify(combined.sources.semianalysis.rows) !== JSON.stringify(legacy.rows)) {
            throw new Error('legacy_rows_mismatch');
          }

          const newestFirst = (left, right) =>
            right.sourceDate.localeCompare(left.sourceDate) ||
            right.loggedDate.localeCompare(left.loggedDate);
          combined.sources.semianalysis.rows = [...combined.sources.semianalysis.rows].sort(newestFirst);
          combined.sources.a16z.rows = [...combined.sources.a16z.rows].sort(newestFirst);
          legacy.rows = [...combined.sources.semianalysis.rows];
          const result = validateFeedPair(combined, legacy);
          console.log(`Current semantic feeds valid: ${JSON.stringify(result)}`);
          EOF
